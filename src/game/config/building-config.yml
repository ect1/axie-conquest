# ==============================================================================
# Axie Conquest — Building Configuration
# ==============================================================================
# Defines construction rules, costs, timers, durability, and building HUD availability.
#
# Available for placement right now:
#   - farm (Everleaf Farm)
#   - lumber (Lumber Mill)
#   - stone (Storage)
#   - barracks (Barracks)
#   - archery (Archery Range)
#
# Movement rule:
#   - Only City Hall (hall) is movable (movable: true). All other buildings are fixed (movable: false).
#
# Level progression:
#   - Buildings support progression up to maxLevel: 3.
#   - Each level (level1, level2, level3) defines the cost to attain that tier,
#     its construction/upgrade time, durability, and level-specific production or perks.
#   - Production defines rateUnits (X units) produced every produceEverySeconds (X seconds).
# ==============================================================================

# Global building system settings & defaults
settings:
  defaultMaxLevel: 3
  demolishRefundRatio: 0.5 # 50% of construction resources refunded on demolition
  instantBuildInDebug: false # Dev cheat toggle to bypass timers

buildings:
  # ----------------------------------------------------------------------------
  # City Center
  # ----------------------------------------------------------------------------
  hall:
    id: hall
    name: "Main Hall"
    category: "City center"
    description: "The heart of your settlement. Your Axies gather here to plan a brighter Lunacia."
    available: false # Pre-built starting building; cannot construct additional halls
    movable: true # City Hall can be relocated across the settlement
    removable: false # City Hall cannot be demolished
    maxLevel: 3
    maxPerCity: 1
    dimensions:
      width: 4
      depth: 4
    model: "" # 3D asset path / GLB identifier
    levels:
      level1:
        health: 5000
        buildTimeSeconds: 0 # Pre-placed at settlement founding
        removeTimerSeconds: 0
        cost:
          food: 0
          wood: 0
          stone: 0
        requirements:
          cityHallLevel: 1
      level2:
        health: 8000
        buildTimeSeconds: 300
        removeTimerSeconds: 0
        cost:
          food: 200
          wood: 300
          stone: 200
        requirements:
          cityHallLevel: 1
      level3:
        health: 12000
        buildTimeSeconds: 600
        removeTimerSeconds: 0
        cost:
          food: 500
          wood: 800
          stone: 500
        requirements:
          cityHallLevel: 2

