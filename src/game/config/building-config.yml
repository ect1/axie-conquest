          stone: 20
        production:
          resource: "food"
          rateUnits: 1 # Number of units produced per cycle
          produceEverySeconds: 10 # Interval in seconds (produces 1 food every 10 seconds)
          storageCapacity: 200 # Maximum uncollected output stored
